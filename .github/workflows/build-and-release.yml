name: Build and Release (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'
      sign:
        description: 'Sign installer with PFX (true/false)'
        required: false
        default: 'false'
  push:
    tags:
      - 'v*'

jobs:
  build_and_release:
    name: Build Windows and publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21 pyinstaller-hooks-contrib==2026.6

      - name: Build and package (Windows)
        shell: powershell
        run: |
          Write-Host 'Run repository build script (tries multiple entry points)'
          if (Test-Path .\build_windows_release.bat) {
            .\build_windows_release.bat
          } elseif (Test-Path .\build_exe_quick.bat) {
            .\build_exe_quick.bat
          } elseif (Test-Path .\build_presentation.bat) {
            .\build_presentation.bat
          } else {
            Write-Host 'No build script found — running pyinstaller directly'
            pyinstaller --clean --noconfirm ArenaDuel.spec
          }

      - name: Ensure portable ZIP exists
        shell: powershell
        run: |
          if (-not (Test-Path dist_windows\ArenaDuel_Windows.zip)) {
            Write-Host 'Creating dist_windows\ArenaDuel_Windows.zip from dist_release\ArenaDuel'
            New-Item -ItemType Directory -Path dist_windows -Force | Out-Null
            Compress-Archive -Path dist_release\ArenaDuel\* -DestinationPath dist_windows\ArenaDuel_Windows.zip -Force
          }

      - name: Optional: sign installer (requires secrets)
        if: >-
          github.event.inputs.sign == 'true' &&
          (secrets.ARENA_DUEL_SIGN_PFX != '')
        shell: powershell
        run: |
          Write-Host 'Decoding PFX and signing installer'
          $b64 = "${{ secrets.ARENA_DUEL_SIGN_PFX }}"
          [IO.File]::WriteAllBytes('cert.pfx',[Convert]::FromBase64String($b64))
          $pfxPass = "${{ secrets.ARENA_DUEL_SIGN_PFX_PASSWORD }}"
          if (-not (Test-Path dist_windows\Installer\Setup_ArenaDuel.exe)) { Write-Error 'Installer not found'; exit 1 }
          signtool sign /f cert.pfx /p $pfxPass /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "dist_windows\Installer\Setup_ArenaDuel.exe"

      - name: Upload build artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: ArenaDuel-dist
          path: |
            dist_windows/ArenaDuel_Windows.zip
            dist_windows/Installer/Setup_ArenaDuel.exe
            dist_release/ArenaDuel/ArenaDuel.exe

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: ${{ github.ref_name || github.event.inputs.tag }}
          files: |
            dist_windows/ArenaDuel_Windows.zip
            dist_windows/Installer/Setup_ArenaDuel.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
